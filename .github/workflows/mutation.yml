name: Mutation tests

# Stryker on the core libraries (stryker.config.mjs): encryption at rest,
# medication compliance, rollups, source ranking, unit conversion and backup
# validation. Too slow for a pull request; it runs once a night and on
# demand, and fails when a module's score drops below its floor in
# stryker.floors.json. The HTML report is uploaded either way.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: mutation (core libraries)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - name: Run Stryker
        run: pnpm exec stryker run --concurrency 4

      # Without pipefail the step takes the exit status of `tee`, which is
      # always 0, so a module under its floor could never fail the run.
      - name: Check the per-module floors
        shell: bash
        run: |
          set -o pipefail
          node scripts/mutation-floors.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30

  # The latest report as a page at https://pages.flisk.si/@mbombeck/mutation-report/,
  # so it can be read without downloading the artifact. It runs after a failed
  # floor check too, which is when the report is most worth reading. Only on
  # main, and it runs none of this repository's code.
  publish-report:
    runs-on: ubuntu-24.04
    name: publish the report (pages.flisk.si)
    needs: [mutation]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref_name == 'main' }}
    permissions:
      id-token: write # pages.flisk.si checks this run's OIDC token to know the repository; no secret is used
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-report
          path: mutation-report

      # Stryker's incremental cache is input for the next run, not for readers.
      - name: Leave out the incremental cache
        run: rm -f mutation-report/stryker-incremental.json

      # An outage of pages.flisk.si must not turn the nightly run red.
      - uses: flisk-sh/pages@ac0c7f25e35cacd0a11d47a28cdb198d295663ee # v1.2.1
        continue-on-error: true
        with:
          path: mutation-report
          command: publish
          slug: mutation-report
